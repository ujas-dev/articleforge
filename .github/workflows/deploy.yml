name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Ensure Pages uses the GitHub Actions build source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -o /dev/null -w "pages source PUT -> %{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}'
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply Supabase database migrations
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGCONNECT_TIMEOUT: "8"
        run: |
          echo "::group::Database migration"
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Using the Supabase CLI (Supavisor/IPv4)."
            supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
            supabase db push
            code=$?
            echo "::endgroup::"
            exit $code
          fi
          if [ -z "$SUPABASE_DB_URL" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::No database connection configured - skipping migrations."
            echo "::endgroup::"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

          # Supabase's direct host (db.<ref>.supabase.co) is IPv6-only and GitHub
          # runners are IPv4, so connect through the Supavisor pooler. The DB
          # password may contain '@' (which breaks URLs), so it is passed via
          # PGPASSWORD and never placed in a URL.
          ref=""
          pass="$SUPABASE_DB_PASSWORD"
          if [ -n "$SUPABASE_DB_URL" ]; then
            ref=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^.*@db\.([a-z0-9-]+)\.supabase\.co.*$#\1#')
            if [ -z "$pass" ]; then
              pass=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^[a-zA-Z]+://[^:]*:(([^@]|@[^@])*)@[^@]*$#\1#')
            fi
          fi
          if [ -z "$ref" ]; then
            ref="$SUPABASE_PROJECT_REF"
          fi
          if [ -z "$ref" ] || [ -z "$pass" ]; then
            echo "::error::Could not determine the project ref or DB password. Set SUPABASE_DB_URL, or SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD."
            echo "::endgroup::"
            exit 1
          fi

          for region in ap-southeast-1 ap-south-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 ap-northeast-3 us-east-1 us-east-2 us-west-1 us-west-2 ca-central-1 eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-central-2 eu-north-1 sa-east-1; do
            for pfx in aws-0 aws-1; do
              host="$pfx-$region.pooler.supabase.com"
              if PGPASSWORD="$pass" psql -w -h "$host" -U "postgres.$ref" -d postgres -c 'select 1' >/dev/null 2>&1; then
                echo "Connected via $host - applying migrations."
                PGPASSWORD="$pass" psql -w -h "$host" -U "postgres.$ref" -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/0001_init.sql
                code=$?
                echo "::endgroup::"
                exit $code
              fi
            done
          done
          echo "::error::Could not reach the database via any Supavisor pooler host. Check the DB password and project ref."
          echo "::endgroup::"
          exit 1
      - name: Ensure the default admin user exists
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ] || [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::warning::Admin user not ensured - set PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ADMIN_EMAIL and ADMIN_PASSWORD."
            exit 0
          fi
          code=$(curl -s -o /tmp/admin.json -w "%{http_code}" -X POST "$SUPABASE_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\",\"email_confirm\":true}")
          echo "admin user create -> HTTP $code"
          cat /tmp/admin.json
          if [ "$code" != "200" ] && [ "$code" != "422" ]; then
            echo "::error::Failed to create or find the admin user (HTTP $code)."
            exit 1
          fi
      - run: npm run check
      - run: npm run check:functions
      - run: npm run lint
      - run: npm run test
      - run: npm run audit
      - run: npm run build
        env:
          # PUBLIC_SITE_URL is an ORIGIN ONLY - the /articleforge sub-path comes
          # from astro.config.mjs `base`. Do not append the repo name here.
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4