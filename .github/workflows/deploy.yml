name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Ensure Pages uses the GitHub Actions build source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -o /dev/null -w "pages source PUT -> %{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}'
      - run: npm ci
      - name: Apply Supabase database migrations
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGPORT: ${{ secrets.SUPABASE_DB_PORT }}
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] && [ -z "$PGHOST" ]; then
            echo "::warning::No database connection configured - skipping migrations. Set SUPABASE_DB_HOST + SUPABASE_DB_USER + SUPABASE_DB_PASSWORD (recommended) or SUPABASE_DB_URL."
            exit 0
          fi
          if [ -n "$SUPABASE_DB_URL" ]; then
            if printf '%s' "$SUPABASE_DB_URL" | grep -q 'db\..*\.supabase\.co'; then
              echo "::error::SUPABASE_DB_URL uses the Direct connection host (db.<ref>.supabase.co) which is IPv6-only and unreachable from GitHub runners. Use the Session Pooler host (aws-0-<region>.pooler.supabase.com:5432), or switch to the SUPABASE_DB_HOST/USER/PASSWORD secrets."
              exit 1
            fi
            if [ "$(printf '%s' "$SUPABASE_DB_URL" | tr -cd '@' | wc -c)" -ne 1 ]; then
              echo "::error::SUPABASE_DB_URL must contain exactly one '@'. If your password contains '@', percent-encode it as %40 - or use the SUPABASE_DB_HOST/USER/PASSWORD secrets instead."
              exit 1
            fi
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          if [ -n "$SUPABASE_DB_URL" ]; then
            psql -w "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0001_init.sql
          else
            psql -w -h "$PGHOST" -p "${PGPORT:-5432}" -U "$PGUSER" -d "${PGDATABASE:-postgres}" -v ON_ERROR_STOP=1 -f supabase/migrations/0001_init.sql
          fi
      - run: npm run check
      - run: npm run check:functions
      - run: npm run lint
      - run: npm run test
      - run: npm run audit
      - run: npm run build
        env:
          # PUBLIC_SITE_URL is an ORIGIN ONLY - the /articleforge sub-path comes
          # from astro.config.mjs `base`. Do not append the repo name here.
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4